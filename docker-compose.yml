services:
  bot:
    image: rainingman/scheduler-bot:latest
    network_mode: host
    volumes:
      - ./bot-data:/data
    env_file:
      - bot/.env
    environment:
      - DATABASE_PATH=/data/scheduler.db
    restart: unless-stopped

  bot-dev:
    image: rainingman/scheduler-bot:dev
    network_mode: host
    volumes:
      - ./bot-data-dev:/data
    env_file:
      - bot/.env.dev
    environment:
      - DATABASE_PATH=/data/scheduler.db
      - PORT=8081
    restart: unless-stopped
