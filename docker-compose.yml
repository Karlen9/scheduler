services:
  bot:
    image: rainingman/scheduler-bot:latest
    # The bot stores its data in SQLite on the ./bot-data bind mount (/data in the container).
    # It does NOT use the `db` service below unless DATABASE_URL is set in bot/.env; with host
    # networking the Postgres host is then localhost:5432.
    network_mode: host
    volumes:
      - ./bot-data:/data
    env_file:
      - bot/.env
    environment:
      - DATABASE_PATH=/data/scheduler.db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: ${DB_PASSWORD:-scheduler}
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  pgdata:
