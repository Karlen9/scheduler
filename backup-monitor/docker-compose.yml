services:
  monitor:
    build: .
    image: scheduler-monitor:latest
    container_name: scheduler-monitor
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backups:/backups
      - ./ssh:/root/.ssh:ro
      - ./state:/var/lib/monitor
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
